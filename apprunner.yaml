version: 1.0
runtime: python311

build:
  commands:
    build:
      - echo "no-op build"   # Python 3.11 uses revised build; install deps in pre-run

run:
  runtime-version: 3.11
  pre-run:
    - pip3 install --upgrade pip
    - pip3 install -r requirements.txt
  command: python3 run.py
  network:
    port: 8080
  secrets:
    - name: GOOGLE_CLOUD_SCOPES
      value-from: arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:google-cloud-scopes-XXXXX
    - name: PINECONE_API_KEY
      value-from: arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:pinecone-api-key-XXXXX
    - name: OPENAI_API_KEY
      value-from: arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:openai-api-key-XXXXX
    - name: DEFAULT_INDEX_NAME
      value-from: arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:default-index-name-XXXXX
    - name: AWS_REGION
      value-from: arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:aws-region-XXXXX
    - name: AWS_ACCOUNT_ID
      value-from: arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:aws-account-id-XXXXX
    - name: REGISTRY_NAME
      value-from: arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:registry-name-XXXXX
    - name: TAG
      value-from: arn:aws:secretsmanager:REGION:ACCOUNT_ID:secret:image-tag-XXXXX
